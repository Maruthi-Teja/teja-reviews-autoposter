name: Monthly Content Calendar

# 1st of every month at 6:00 AM IST (12:30 AM UTC)
on:
  schedule:
    - cron: '30 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate monthly topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node monthly-topics.js

      - name: Commit topics.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git diff --staged --quiet || git commit -m "chore: update topics.json for $(date +'%B %Y') [skip ci]"
          git push
